services:
  _defaults:
    autoconfigure: true
    autowire: true

  Drupal\helfi_azure_fs\Config\RemoteVideoThumbnailDirectoryOverride:
    tags:
      - { name: config.factory.override, priority: 5 }

  Drupal\helfi_azure_fs\Config\DefaultFileSchemeOverride:
    tags:
      - { name: config.factory.override, priority: 5 }

  azure_file_system:
    class: Drupal\helfi_azure_fs\AzureFileSystem
    decorates: file_system
    decoration_priority: 5
    arguments:
      - '@azure_file_system.inner'
      - '@stream_wrapper_manager'
      - '@settings'

